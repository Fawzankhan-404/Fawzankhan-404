<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="260" viewBox="0 0 1600 260" role="img" aria-labelledby="title desc">
  <title id="title">04 Education</title>
  <desc id="desc">A crimson Itachi-inspired education banner for Fawzan Khan's GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08090f"/>
