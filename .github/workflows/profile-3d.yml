name: Refresh GitHub contribution artwork

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - "scripts/generate_github_activity.py"

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh activity and commit only when it changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional classic PAT with only the read:user scope; add it as a repository Actions secret.
          PROFILE_READ_USER_TOKEN: ${{ secrets.PROFILE_READ_USER_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            base="$(git rev-parse origin/main)"
            git reset --hard "$base"
            python scripts/generate_github_activity.py
            git add README.md profile-3d-contrib/
            if git diff --cached --quiet; then
              echo "Contribution data unchanged; no commit needed"
              exit 0
            fi
            git commit -m "Refresh contribution artwork from GitHub"
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base" ]; then
              echo "Push failed and main did not advance; stopping"
              exit 1
            fi
            echo "main advanced during the update; retrying from the latest main"
          done
          echo "main kept advancing; exhausted three safe retries"
          exit 1
