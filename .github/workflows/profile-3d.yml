name: Refresh GitHub contribution artwork

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-3d.yml"
      - "scripts/generate_github_activity.py"

concurrency:
  group: profile-activity-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build activity from official GitHub GraphQL
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_github_activity.py
      - name: Commit only if activity changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-rainbow.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh contribution artwork from GitHub"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
